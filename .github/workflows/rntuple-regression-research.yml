name: ROOT staging full project CTest

on:
  push:
    branches:
      - research/rntuple-recompression-ci-warning
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-root-ctest:
    name: Full ROOT build and test (official Ubuntu CI image)
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    container:
      image: registry.cern.ch/root-ci/ubuntu2404:buildready
      options: --security-opt label=disable
    env:
      PYTHONUNBUFFERED: "1"
      HOME: /github/home
    steps:
      - name: Checkout official ROOT CI scripts from staging
        uses: actions/checkout@v6
        with:
          ref: staging/rntuple-recompression-page-checksum
      - name: Check runner and set up workspace
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          echo "Exact staging commit: 4453d740f5e0f5fa96ca6fe933549d55ccde5e2e"
          git rev-parse HEAD
          test "$(git rev-parse HEAD)" = "4453d740f5e0f5fa96ca6fe933549d55ccde5e2e"
          df -h
          mkdir -p "$HOME/ROOT-CI"
      - name: Full ROOT build and all configured CTest tests
        shell: bash
        run: |
          set -euo pipefail
          .github/workflows/root-ci-config/build_root.py \
            --buildtype RelWithDebInfo \
            --platform ubuntu2404 \
            --platform_config ubuntu2404 \
            --incremental false \
            --upload_artifacts false \
            --base_ref staging/rntuple-recompression-page-checksum \
            --sha 4453d740f5e0f5fa96ca6fe933549d55ccde5e2e \
            --repository https://github.com/Johnny-Kao/root.git \
            --overrides asserts=ON LLVM_ENABLE_ASSERTIONS=ON imt=OFF CMAKE_BUILD_TYPE=Debug
