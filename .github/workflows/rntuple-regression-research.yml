name: RNTuple regression research

on:
  push:
    branches:
      - research/rntuple-recompression-ci-warning
  workflow_dispatch:

permissions:
  contents: read

jobs:
  targeted-rntuple-merger:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake g++ python3-dev libx11-dev libxpm-dev libxft-dev libxext-dev libssl-dev liblzma-dev libxxhash-dev libgtest-dev libgmock-dev nlohmann-json3-dev
      - name: Configure ROOT
        run: |
          cmake -S . -B build -G Ninja -Dminimal=ON -Dtesting=ON -DCMAKE_BUILD_TYPE=Release -Dbuiltin_zlib=ON -Dbuiltin_zstd=ON
      - name: Build ROOT and tests
        run: cmake --build build -j 2
      - name: Run merger regression
        run: ctest --test-dir build -R '^gtest-tree-ntuple-ntuple-merger$' --output-on-failure
